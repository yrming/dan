name: dan
description: "A nimble Fanfou client."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2
  flutter: ^3.44.7

dependencies:
  appearance_repository:
    path: packages/appearance_repository
  authentication_repository:
    path: packages/authentication_repository
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.1
  characters: ^1.4.1
  direct_message_repository:
    path: packages/direct_message_repository
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.2
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.2.4
  flutter_web_auth_2: ^6.0.0-alpha.5
  gal: ^2.3.3
  go_router: ^17.3.0
  html: ^0.15.6
  image_picker: ^1.2.3
  intl: ^0.20.2
  markdown: ^7.3.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  remixicon: ^4.9.3
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  status_repository:
    path: packages/status_repository
  url_launcher: ^6.3.2
  user_api_client:
    path: packages/user_api_client
  user_repository:
    path: packages/user_repository
dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0
dependency_overrides:
  # path_provider_android 2.3.x uses jni 1.0.1, whose Gradle plugin is not
  # compatible with this project's AGP 9 configuration yet.
  path_provider_android: 2.2.20

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/about.md
    - assets/icons/
    - assets/user-agreement.md
    - assets/privacy-policy.md

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/logo.png"
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
