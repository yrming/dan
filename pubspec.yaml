name: dan
description: "A Fanfou client."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.14.0
  flutter: ^3.50.1

dependencies:
  appearance_repository:
    path: packages/appearance_repository
  authentication_repository:
    path: packages/authentication_repository
  bloc: ^9.2.2
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.7
  characters: ^1.4.1
  cupertino_ui: ^1.1.7
  direct_message_repository:
    path: packages/direct_message_repository
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.5.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.5.0
  flutter_web_auth_2: ^6.1.0
  gal: ^3.0.1
  go_router: ^18.1.4
  html: ^0.15.7
  image_picker: ^1.2.4
  intl: ^0.20.3
  markdown: ^7.3.1
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  remixicon: ^4.9.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  status_repository:
    path: packages/status_repository
  url_launcher: ^6.3.3
  user_api_client:
    path: packages/user_api_client
  user_repository:
    path: packages/user_repository
dev_dependencies:
  bloc_lint: ^0.4.4
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.26
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
dependency_overrides:
  # path_provider_android 2.3.x uses jni 1.0.1, whose Gradle plugin is not
  # compatible with this project's AGP 9 configuration yet.
  path_provider_android: 2.2.20

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/about.md
    - assets/icons/
    - assets/images/
    - assets/user-agreement.md
    - assets/privacy-policy.md

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/logo.png"
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  remove_alpha_ios: true
